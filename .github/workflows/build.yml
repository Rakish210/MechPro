name: Build MechPro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build AutoCAD 2021 add-in
        shell: pwsh
        run: |
          msbuild .\src\MechPro\MechPro.csproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Publish DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechPro-AutoCAD2021
          path: src/MechPro/bin/Release/MechPro.dll
          if-no-files-found: error
          retention-days: 14
